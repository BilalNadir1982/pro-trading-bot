name: Kripto Sinyal Bot Otomasyonu

on:
  push:
    branches: [ main, master ]  # Koda güncelleme gelirse otomatik başlasın
  workflow_dispatch:            # GitHub panelinden elle başlatma butonu

jobs:
  run-crypto-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Hızlı kurulum için önbelleğe al

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kripto Tarayıcıyı Başlat
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

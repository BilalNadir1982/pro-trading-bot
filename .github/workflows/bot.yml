name: Crypto Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # her 5 dakika
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo çek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Paket kur
        run: pip install -r requirements.txt

      - name: Bot çalıştır
        run: python main.py

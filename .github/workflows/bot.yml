name: Kripto Sinyal Bot Otomasyonu

on:
  schedule:
    # Her 30 dakikada bir otomatik tetiklenir (7/24 Kesintisiz)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  run-crypto-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kripto Tarayıcıyı Tetikle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
